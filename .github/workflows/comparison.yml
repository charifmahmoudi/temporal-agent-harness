name: Comparative evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/scripts/compare_verification.py'
      - 'research/evaluation/corpus.json'
      - '.github/workflows/comparison.yml'
      - 'tests/evaluation/**'

permissions:
  contents: read

jobs:
  current-scoring:
    name: Current revision scoring controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Check current experiment scoring
        run: uv run --frozen pytest tests/evaluation/ -q
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Historical reproduction: preserve exact source and protocol bytes.
          ref: ccb74997404f6b9fd9f5654ac5a441337581d673
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned TLA+ tools
        run: curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
      - name: Check experiment scoring
        run: uv run --frozen pytest tests/evaluation/ -q
      - name: Run frozen comparative experiment
        run: uv run --frozen python research/scripts/compare_verification.py --jar "$RUNNER_TEMP/tla2tools.jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparative-evaluation
          path: |
            research/results/comparison/summary.json
            research/results/comparison/**/pytest.log
            research/results/comparison/**/results.xml
            research/results/comparison/**/provenance.json
            research/results/comparison/**/research/results/traces/*.json
            research/results/comparison/**/research/results/cascade-traces/*.json
            research/results/comparison/**/research/results/conformance/**/TLC.log
            research/results/comparison/**/research/results/conformance/**/*.tla
            research/results/comparison/**/research/results/conformance/**/*.cfg
            research/results/comparison/**/research/results/cascade-conformance/**/TLC.log
            research/results/comparison/**/research/results/cascade-conformance/**/*.tla
            research/results/comparison/**/research/results/cascade-conformance/**/*.cfg
