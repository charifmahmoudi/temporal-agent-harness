name: Exploratory recovery operations
on:
  pull_request:
    paths:
      - 'research/scripts/probe_recovery_temporal.py'
      - 'research/scripts/probe_recovery_restate.py'
      - 'research/scripts/discovery_restate_service.py'
      - '.github/workflows/discovery-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [temporal, restate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK and record environment
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          mkdir -p research/results/discovery-recovery/$ENGINE
          if [ "$ENGINE" = temporal ]; then
            pip install temporalio==1.34.0
          else
            pip install restate-sdk==1.0.5 hypercorn==0.17.3 httpx==0.28.1
          fi
          pip freeze > research/results/discovery-recovery/$ENGINE/dependencies.txt
          python --version > research/results/discovery-recovery/$ENGINE/python.txt
          sha256sum research/scripts/probe_recovery_*.py research/scripts/discovery_restate_service.py > research/results/discovery-recovery/$ENGINE/source-sha256.txt
      - name: Start Temporal development server
        if: matrix.engine == 'temporal'
        run: |
          curl --fail --location --retry 3 https://github.com/temporalio/cli/releases/download/v1.7.0/temporal_cli_1.7.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/temporal.tar.gz"
          echo "8b5de72e622f4ae062d0d5d948ca398de6212d63b2f25766a1cb810a3dc2d0ed  $RUNNER_TEMP/temporal.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/temporal.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/temporal" --version > research/results/discovery-recovery/temporal/server-version.txt
          "$RUNNER_TEMP/temporal" server start-dev --headless > research/results/discovery-recovery/temporal/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if "$RUNNER_TEMP/temporal" operator cluster health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start Restate development server
        if: matrix.engine == 'restate'
        run: |
          curl --fail --location --retry 3 https://github.com/restatedev/restate/releases/download/v1.7.13/restate-server-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/restate.tar.xz"
          echo "5429b216b68f3fa52b7f0e6627a2c2a86fc0c75d19b1e152cd2e7dcd8bab4c82  $RUNNER_TEMP/restate.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/restate.tar.xz" -C "$RUNNER_TEMP"
          RESTATE_BIN=$(find "$RUNNER_TEMP" -type f -name restate-server | head -1)
          "$RESTATE_BIN" --version > research/results/discovery-recovery/restate/server-version.txt
          "$RESTATE_BIN" > research/results/discovery-recovery/restate/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:9070/version; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run declared trials
        env:
          ENGINE: ${{ matrix.engine }}
        run: python research/scripts/probe_recovery_$ENGINE.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-recovery-${{ matrix.engine }}
          path: research/results/discovery-recovery/
          if-no-files-found: error
