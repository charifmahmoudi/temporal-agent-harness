name: Local activity identity baseline
on:
  pull_request:
    paths:
      - 'research/scripts/reproduce_local_activity_identity.py'
      - 'research/scripts/identity_scoring.py'
      - '.github/workflows/local-activity-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install affected release dependencies
        run: |
          pip install temporalio==1.33.0
          mkdir -p research/results/local-activity-identity/server
          pip freeze > research/results/local-activity-identity/dependencies-1.33.txt
      - name: Verify shared server
        run: |
          curl --fail --location --retry 3 https://github.com/temporalio/cli/releases/download/v1.7.0/temporal_cli_1.7.0_linux_amd64.tar.gz -o research/results/local-activity-identity/server/cli.tar.gz
          echo '8b5de72e622f4ae062d0d5d948ca398de6212d63b2f25766a1cb810a3dc2d0ed  research/results/local-activity-identity/server/cli.tar.gz' | sha256sum -c -
          tar -xzf research/results/local-activity-identity/server/cli.tar.gz -C research/results/local-activity-identity/server
      - name: Affected same-version local and remote controls
        run: python research/scripts/reproduce_local_activity_identity.py --temporal research/results/local-activity-identity/server/temporal --output research/results/local-activity-identity/1.33
      - name: Replace only SDK
        run: |
          pip install --no-deps temporalio==1.34.0
          pip check
          pip freeze > research/results/local-activity-identity/dependencies-1.34.txt
      - name: Fixed freshly recorded local and remote controls
        run: python research/scripts/reproduce_local_activity_identity.py --temporal research/results/local-activity-identity/server/temporal --output research/results/local-activity-identity/1.34
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-activity-identity
          path: |
            research/results/local-activity-identity/1.*/
            research/results/local-activity-identity/dependencies-*.txt
