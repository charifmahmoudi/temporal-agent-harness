name: Cancellation and recovery investigation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'temporal_agent_harness/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/cancellation/**'
      - 'research/models/cancellation/**'
      - 'research/scripts/check_cancellation_model.py'
      - 'research/scripts/prepare_cancellation_variant.py'
      - '.github/workflows/cancellation.yml'

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned TLA+ tools
        run: curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
      - name: Check cancellation safety and progress assumptions
        run: python research/scripts/check_cancellation_model.py --jar "$RUNNER_TEMP/tla2tools.jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancellation-model
          path: research/results/cancellation-model/
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Characterize unmodified implementation and replay histories
        run: uv run --frozen pytest tests/cancellation/ -q --junitxml=research/results/cancellation-baseline.xml
      - name: Prepare isolated proposed correction
        run: python research/scripts/prepare_cancellation_variant.py --output research/results/cancellation-corrected
      - name: Validate isolated correction with identical stimuli and replay
        working-directory: research/results/cancellation-corrected
        env:
          CANCELLATION_VARIANT: corrected
        run: PYTHONPATH="$PWD" "$GITHUB_WORKSPACE/.venv/bin/python" run.py tests/cancellation/ -q --junitxml=results.xml
      - name: Run all harness regressions against the isolated correction
        working-directory: research/results/cancellation-corrected
        run: PYTHONPATH="$PWD" "$GITHUB_WORKSPACE/.venv/bin/python" run.py tests/harness/ -q --junitxml=harness-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancellation-implementation
          path: |
            research/results/cancellation-baseline.xml
            research/results/cancellation/
            research/results/cancellation-corrected/results.xml
            research/results/cancellation-corrected/harness-results.xml
            research/results/cancellation-corrected/provenance.json
            research/results/cancellation-corrected/proposed.patch
            research/results/cancellation-corrected/research/results/cancellation/
