name: Cross-version replay investigation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/scripts/replay_upgrade.py'
      - 'research/scripts/prepare_cancellation_variant.py'
      - 'research/evaluation/upgrade-*'
      - 'research/evaluation/cancellation-evidence/implementation.zip'
      - 'tests/evaluation/test_upgrade_projection.py'
      - 'tests/cancellation/test_cancellation_recovery.py'
      - 'temporal_agent_harness/**'
      - 'uv.lock'
      - '.github/workflows/upgrade-replay.yml'

permissions:
  contents: read

jobs:
  current-scoring:
    name: Current revision scoring controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Check current experiment scoring
        run: uv run --frozen pytest tests/evaluation/test_upgrade_projection.py -q
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical reproduction: preserve exact source and protocol bytes.
          ref: ccb74997404f6b9fd9f5654ac5a441337581d673
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.23'
          python-version: '3.12'
      - name: Check evidence scoring controls
        run: uv run --frozen pytest tests/evaluation/test_upgrade_projection.py -q
      - name: Replay both history sets under baseline source
        run: uv run --frozen python research/scripts/replay_upgrade.py --root "$PWD" --variant baseline --output research/results/upgrade/baseline.json
      - name: Prepare isolated correction
        run: python research/scripts/prepare_cancellation_variant.py --output research/results/cancellation-corrected
      - name: Replay both history sets under corrected source
        working-directory: research/results/cancellation-corrected
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/research/scripts/replay_upgrade.py" --root "$GITHUB_WORKSPACE" --variant corrected --output "$GITHUB_WORKSPACE/research/results/upgrade/corrected.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-version-replay
          path: research/results/upgrade/
